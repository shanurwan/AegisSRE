name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-test-only
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis:aegis-test-only@127.0.0.1:5432/aegis?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: true

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: E2E control-plane workflow
        shell: bash
        run: |
          test "$(go test -list '^TestE2E' ./internal/integration | grep -c '^TestE2E')" -ge 5
          go test -count=1 -timeout=30s -run '^TestE2E' ./internal/integration

      - name: Vet
        run: go vet ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build CLI
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/aegissre ./cmd/aegissre

  race:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-test-only
          POSTGRES_DB: aegis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AEGIS_TEST_DATABASE_URL: postgres://aegis:aegis-test-only@127.0.0.1:5432/aegis?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: true

      - name: Exercise concurrent paths with the race detector
        run: go test -race -count=1 ./...

  deployment-assets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Render Kubernetes variants
        run: |
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/overlays/dry-run >/dev/null

      - name: Enforce production and laboratory manifest policy
        run: make manifest-policy-overlays

      - name: Test guarded live-acceptance harness
        run: python -B -m unittest discover -s hack -p '*_test.py'

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build image
        run: docker build --build-arg GO_VERSION=1.26.10 --tag aegissre:test .

      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegissre:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
