name: Test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: E2E control-plane workflow
        shell: bash
        run: |
          test "$(go test -list '^TestE2E' ./internal/integration | grep -c '^TestE2E')" -ge 2
          go test -count=1 -timeout=30s -run '^TestE2E' ./internal/integration

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/aegissre ./cmd/aegissre

  deployment-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render Kubernetes variants
        run: |
          kubectl kustomize deploy/kubernetes/base >/dev/null
          kubectl kustomize deploy/kubernetes/overlays/dry-run >/dev/null
          kubectl kustomize deploy/kubernetes/overlays/execute >/dev/null

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build image
        run: docker build --build-arg GO_VERSION=1.26.8 --tag aegissre:test .
