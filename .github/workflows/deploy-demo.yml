name: Deploy demo

# Publishes demo/ (Breach AegisSRE) to Cloudflare Pages, but only after the
# recorded attack outcomes are proven to match the current code. Needs the
# repository secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the job verifies and skips the deploy.

on:
  push:
    branches: ["main"]
    paths: ["demo/**", "hack/breach/**", "internal/**", ".github/workflows/deploy-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and deploy the demo
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: Prove every recorded outcome still matches the code
        run: go test -count=1 ./hack/breach

      - name: Check the page
        run: node --check demo/game.js

      - name: Skip when Cloudflare is not configured
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the demo was verified but not deployed."

      - name: Deploy to Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create aegissre --production-branch=main || true
          command: pages deploy demo --project-name=aegissre --branch=main --commit-dirty=true
