name: Security

# Every job is a blocking gate: a finding fails the run. Reports are kept as
# artifacts. The repository is private, so results are not uploaded to code
# scanning, which needs GitHub Advanced Security; see docs/security-pipeline.md.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly, so newly published CVEs surface without a code change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"

jobs:
  secrets:
    name: Secrets · gitleaks (full history)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  sast:
    name: SAST · gosec + Semgrep
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # Each suppression in the code is a reviewed `#nosec <rule> -- reason`.
      - name: gosec
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 \
            -fmt sarif -out gosec.sarif -stdout -verbose text ./...

      - name: Semgrep (Go, Dockerfile, GitHub Actions rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan --config p/golang --config p/dockerfile --config p/github-actions \
            --error --metrics off --sarif-output=semgrep.sarif

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast
          path: "*.sarif"
          if-no-files-found: ignore

  codeql:
    name: SAST · CodeQL
    # CodeQL is free for public repositories; on a private one it needs a
    # GitHub Advanced Security licence. Runs as soon as the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: codeql-results

      - name: Fail on any CodeQL result
        run: |
          count="$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)"
          echo "CodeQL results: $count"
          test "$count" -eq 0

  dependencies:
    name: Dependencies · OSV-Scanner + Trivy (vulns, secrets)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # govulncheck (reachability-aware) runs in test.yml. These two flag any
      # known-vulnerable module version whether or not it is reachable.
      # OSV-Scanner 2.7.0 needs Go 1.27 to build, so use the release binary.
      - name: Install checksum-pinned OSV-Scanner
        env:
          OSV_SCANNER_VERSION: 2.7.0
          OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      - name: OSV-Scanner
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --recursive .

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  iac:
    name: IaC · Trivy misconfiguration (rendered Kubernetes, Dockerfiles, Compose)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Overlays are kustomize patches. Scanning them alone reports settings
      # that base/ provides, so scan what would actually be applied.
      - name: Render every Kubernetes variant
        run: |
          mkdir -p rendered
          for overlay in base overlays/dry-run overlays/production overlays/laboratory overlays/laboratory/execute; do
            kubectl kustomize "deploy/kubernetes/$overlay" >"rendered/${overlay//\//-}.yaml"
          done

      - name: Scan rendered manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

      - name: Scan Dockerfiles, Compose and base manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: deploy/kubernetes/overlays,rendered
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  workflows:
    name: CI/CD · actionlint + zizmor
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # actionlint 1.7.12 predates the concurrency `queue` key that image.yml
      # uses to serialise releases; GitHub accepts and enforces it.
      - name: actionlint
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -ignore 'unexpected key "queue" for "concurrency" section'

      - name: zizmor
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --offline .github/workflows

  dast:
    name: DAST · ZAP active API scan of the release image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the DAST gate
        run: python3 -B -m unittest discover -s security/dast -p '*_test.py'

      - name: Build the release image
        run: docker build --build-arg GO_VERSION="$GO_VERSION" --tag aegissre:local .

      - name: Start the fixture topology
        run: docker compose up --detach --no-build --wait

      - name: Attack every service
        run: security/dast/scan.sh build/dast

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast
          path: build/dast
          if-no-files-found: ignore

      - name: Stop the topology
        if: always()
        run: docker compose down --timeout 15

  iast:
    name: IAST · race- and coverage-instrumented runtime under attack
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build the instrumented image
        run: |
          docker build --file security/iast/Dockerfile \
            --build-arg GO_VERSION="$GO_VERSION" --tag aegissre:iast .

      - name: Start the instrumented topology
        run: |
          mkdir -p build/iast
          chmod 0777 build/iast
          docker compose -f compose.yaml -f security/iast/compose.yaml up --detach --no-build --wait

      # Findings are gated by the DAST job against the release image; here the
      # same traffic exercises the instrumented build for the runtime checks.
      - name: Drive the attack traffic
        run: security/dast/scan.sh build/iast-zap || true

      - name: Stop gracefully so coverage is flushed
        run: docker compose -f compose.yaml -f security/iast/compose.yaml stop --timeout 30

      - name: Assess races, crashes and boundary reach
        run: security/iast/assess.sh -f compose.yaml -f security/iast/compose.yaml

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iast
          path: |
            build/iast
            build/iast-zap
          if-no-files-found: ignore

      - name: Remove the topology
        if: always()
        run: docker compose -f compose.yaml -f security/iast/compose.yaml down --timeout 15
