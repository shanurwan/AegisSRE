# Keep every pinned input moving: Go modules, SHA-pinned Actions and
# digest-pinned base images. Each update still has to pass the Security gates.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /
      - /security/iast
    schedule:
      interval: weekly
