# DAST attack surface of the three A2A agents (Monitor, Investigator,
# Operator) in the compose fixture topology. ZAP's API scan imports this file
# and actively attacks every operation; it is not a public API contract.
openapi: 3.0.3
info:
  title: AegisSRE agent surface (DAST)
  version: "1"
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      responses:
        "200": { description: Liveness }
  /readyz:
    get:
      responses:
        "200": { description: Readiness }
  /metrics:
    get:
      responses:
        "200": { description: Prometheus metrics }
  /.well-known/agent-card.json:
    get:
      responses:
        "200": { description: A2A Agent Card }
  /a2a:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: { type: string, example: "2.0" }
                id: { type: string, example: "dast-1" }
                method: { type: string, example: SendMessage }
                params:
                  type: object
                  properties:
                    message:
                      type: object
                      properties:
                        messageId: { type: string, example: dast-message-1 }
                        role: { type: string, example: ROLE_USER }
                        parts:
                          type: array
                          items:
                            type: object
                            properties:
                              text: { type: string, example: investigate outage-arena/web }
      responses:
        "200": { description: JSON-RPC response }
