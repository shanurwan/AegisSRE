# Example only. This file is intentionally excluded from kustomization.yaml.
# Generate base64 Ed25519 values locally, then create the real Secret without
# committing it. Copy the values printed by `aegissre keygen`:
#
#   aegissre keygen
#   kubectl -n outage-arena create secret generic aegis-delegation-keys \
#     --from-literal=private-key='BASE64_PRIVATE_VALUE' \
#     --from-literal=public-key='BASE64_PUBLIC_VALUE'
#
# Monitor receives only private-key. Operator and action MCP receive only
# public-key. With no Secret, the system remains diagnosis-only and cannot
# execute remediation.
apiVersion: v1
kind: Secret
metadata:
  name: aegis-delegation-keys
  namespace: outage-arena
type: Opaque
stringData:
  private-key: REPLACE_WITH_BASE64_ED25519_PRIVATE_KEY
  public-key: REPLACE_WITH_BASE64_ED25519_PUBLIC_KEY
