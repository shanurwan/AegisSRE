apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-monitor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-monitor
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: aegissre
    spec:
      serviceAccountName: aegis-monitor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: ghcr.io/shanurwan/aegissre:latest
          imagePullPolicy: Always
          command: ["/usr/local/bin/aegissre", "monitor"]
          envFrom:
            - configMapRef:
                name: aegis-config
          env:
            - name: AEGIS_PUBLIC_URL
              value: http://aegis-monitor:8080
            - name: AEGIS_DELEGATION_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-delegation-keys
                  key: private-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-monitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-monitor
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
