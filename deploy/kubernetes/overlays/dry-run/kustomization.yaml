apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: aegis-config
    patch: |-
      - op: replace
        path: /data/AEGIS_DRY_RUN
        value: "true"
      - op: replace
        path: /data/AEGIS_ALLOW_MUTATIONS
        value: "false"
