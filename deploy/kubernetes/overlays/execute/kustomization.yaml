# Applying this overlay enables the action MCP adapter to mutate deployments.
# It still requires a valid Monitor-signed delegation and is bounded by RBAC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: aegis-config
    patch: |-
      - op: replace
        path: /data/AEGIS_DRY_RUN
        value: "false"
      - op: replace
        path: /data/AEGIS_ALLOW_MUTATIONS
        value: "true"
