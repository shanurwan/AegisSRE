apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-operator
spec:
  template:
    spec:
      containers:
        - name: operator
          env:
            - name: AEGIS_DELEGATION_PUBLIC_KEY
              $patch: delete
            - name: AEGIS_WHATSAPP_PHONE_NUMBER_ID
              $patch: delete
            - name: AEGIS_WHATSAPP_ACCESS_TOKEN
              $patch: delete
            - name: AEGIS_WHATSAPP_RECIPIENT
              $patch: delete
            - name: AEGIS_DELEGATION_PUBLIC_KEYRING_FILE
              value: /var/run/secrets/aegissre/signing/trusted-public-keys.json
            - name: AEGIS_WORKLOAD_POLICY_FILE
              value: /etc/aegissre/policy/policy.json
            - name: AEGIS_DATABASE_URL_FILE
              value: /var/run/secrets/aegissre/database/url
            - name: AEGIS_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: AEGIS_PUBLIC_URL
              value: https://aegis-operator:8443
            - name: AEGIS_TLS_CERT_FILE
              value: /var/run/secrets/aegissre/tls/tls.crt
            - name: AEGIS_TLS_KEY_FILE
              value: /var/run/secrets/aegissre/tls/tls.key
            - name: AEGIS_TLS_CA_FILE
              value: /var/run/secrets/aegissre/trust/ca.crt
            - name: AEGIS_TLS_IDENTITY
              value: spiffe://aegissre.internal/ns/outage-arena/sa/aegis-operator
          volumeMounts:
            - name: workload-policy
              mountPath: /etc/aegissre/policy
              readOnly: true
            - name: delegation-verification
              mountPath: /var/run/secrets/aegissre/signing
              readOnly: true
            - name: tls-leaf
              mountPath: /var/run/secrets/aegissre/tls
              readOnly: true
            - name: tls-trust
              mountPath: /var/run/secrets/aegissre/trust
              readOnly: true
            - name: database
              mountPath: /var/run/secrets/aegissre/database
              readOnly: true
      volumes:
        - name: workload-policy
          configMap:
            name: aegis-workload-policy
        - name: delegation-verification
          secret:
            secretName: aegis-delegation-keyring
            optional: false
            defaultMode: 288
            items:
              - key: trusted-public-keys.json
                path: trusted-public-keys.json
        - name: tls-leaf
          secret:
            secretName: aegis-operator-tls
            optional: false
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tls-trust
          secret:
            secretName: aegis-mtls-ca
            optional: false
            defaultMode: 288
            items:
              - key: ca.crt
                path: ca.crt
        - name: database
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: aegis-operator-postgres
                  optional: false
                  items:
                    - key: url
                      path: url
              - secret:
                  name: aegis-postgres-ca
                  optional: false
                  items:
                    - key: ca.crt
                      path: ca.crt
