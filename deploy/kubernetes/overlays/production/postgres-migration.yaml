apiVersion: batch/v1
kind: Job
metadata:
  # Release automation must replace this with a unique, immutable release ID.
  name: aegis-postgres-migrate-replace-before-live
  labels:
    app.kubernetes.io/name: aegis-postgres-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: aegissre
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-postgres-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: aegissre
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/shanurwan/aegissre:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/aegissre
            - migrate
          env:
            - name: AEGIS_DATABASE_URL_FILE
              value: /var/run/secrets/aegissre/database/url
            - name: AEGIS_DATABASE_MAX_CONNECTIONS
              value: "2"
          volumeMounts:
            - name: database
              mountPath: /var/run/secrets/aegissre/database
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: database
          projected:
            defaultMode: 288
            sources:
              - secret:
                  name: aegis-postgres-migration
                  optional: false
                  items:
                    - key: url
                      path: url
              - secret:
                  name: aegis-postgres-ca
                  optional: false
                  items:
                    - key: ca.crt
                      path: ca.crt
