apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aegis-mcp-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # Harmless fail-closed sentinel. A deployment integration must replace it
    # with the exact reviewed workload name.
    resourceNames: ["replace-before-live"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
